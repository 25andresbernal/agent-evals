[project]
name = "agent-evals"
version = "0.1.0"
description = "A lightweight framework for evaluating LLM agents against a PM-authored scorecard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andre Bernal" }]
keywords = ["llm", "agents", "evals", "evaluation", "llm-judge"]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
dev = ["pytest>=8.0", "ruff>=0.6.0", "anthropic>=0.40.0"]

[project.scripts]
agent-evals = "agent_evals.cli:main"

[project.urls]
Homepage = "https://github.com/25andresbernal/agent-evals"
Issues = "https://github.com/25andresbernal/agent-evals/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_evals"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
